# Pull a published image from GHCR instead of building on Unraid.
# Set GHCR_OWNER in .env, or replace the placeholder below.
services:
  meru:
    image: ghcr.io/${GHCR_OWNER:?Set GHCR_OWNER in .env}/meru:${MERU_VERSION:-3.63.2}
    container_name: meru
    restart: unless-stopped
    security_opt:
      - seccomp:unconfined
    ports:
      - "${BIND_IP:-0.0.0.0}:3011:3001"
    environment:
      PUID: ${PUID:-99}
      PGID: ${PGID:-100}
      TZ: ${TZ:-America/Chicago}
      CUSTOM_USER: ${WEBTOP_USER:?Set WEBTOP_USER in .env}
      PASSWORD: ${WEBTOP_PASSWORD:?Set WEBTOP_PASSWORD in .env}
      PIXELFLUX_WAYLAND: "false"
    volumes:
      - /mnt/user/appdata/meru:/config
    shm_size: "1gb"
