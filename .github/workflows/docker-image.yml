name: Build and publish Meru

on:
  schedule:
    - cron: '17 9 * * *' # Daily at 09:17 UTC; GitHub schedules may be delayed
  workflow_dispatch:
    inputs:
      meru_version:
        description: 'Optional exact stable version (e.g. 3.63.2); blank = newest stable'
        required: false
        type: string
      force_rebuild:
        description: 'Rebuild even when this version tag already exists'
        required: false
        default: false
        type: boolean
  push:
    branches: [main]
    paths:
      - Dockerfile
      - root/**
      - .github/workflows/docker-publish.yml

permissions:
  contents: write
  packages: write

concurrency:
  group: meru-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve latest stable upstream release
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          INPUT_VERSION: ${{ inputs.meru_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${INPUT_VERSION:-}" ]]; then
            VERSION="${INPUT_VERSION#v}"
            # Check the requested tag really is a published, non-prerelease Meru release.
            curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/zoidsh/meru/releases/tags/${INPUT_VERSION}" \
              -o /tmp/meru-release.json || \
            curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/zoidsh/meru/releases/tags/v${VERSION}" \
              -o /tmp/meru-release.json || \
            curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              "https://api.github.com/repos/zoidsh/meru/releases/tags/${VERSION}" \
              -o /tmp/meru-release.json
          else
            curl -fsSL --retry 3 -H 'Accept: application/vnd.github+json' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              'https://api.github.com/repos/zoidsh/meru/releases/latest' \
              -o /tmp/meru-release.json
          fi
          python3 - <<'PY'
          import json, os, re
          with open('/tmp/meru-release.json') as f:
              release = json.load(f)
          if release.get('draft') or release.get('prerelease'):
              raise SystemExit('Refusing to build a draft or prerelease')
          tag = release['tag_name']
          version = tag.removeprefix('v')
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit(f'Unsupported stable version tag: {tag}')
          if not any(a['name'].endswith('_amd64.deb') for a in release.get('assets', [])):
              raise SystemExit('Stable release has no Linux amd64 .deb asset')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f'value={version}\n')
          print('Stable Meru version:', version)
          PY

      - name: Extract official Meru icon from release package
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PYICON'
          import json, os, urllib.request
          with open('/tmp/meru-release.json') as f:
              release = json.load(f)
          assets = [a for a in release['assets'] if a['name'].endswith('_amd64.deb')]
          if len(assets) != 1:
              raise SystemExit('Expected exactly one official amd64 .deb release asset')
          request = urllib.request.Request(assets[0]['browser_download_url'], headers={'User-Agent':'meru-unraid-icon-sync'})
          with urllib.request.urlopen(request, timeout=180) as response, open('/tmp/meru-icon-source.deb','wb') as out:
              import shutil
              shutil.copyfileobj(response, out)
          PYICON
          mkdir -p /tmp/meru-official-package assets
          dpkg-deb -x /tmp/meru-icon-source.deb /tmp/meru-official-package
          python3 - <<'PYICON'
          from pathlib import Path
          import struct, shutil
          root=Path('/tmp/meru-official-package')
          candidates=[]
          for p in root.rglob('*.png'):
              path=str(p).lower()
              if 'icon' not in path and '/apps/' not in path: continue
              if 'meru' not in path: continue
              try:
                  with p.open('rb') as f:
                      head=f.read(24)
                  if head[:8] != b'\x89PNG\r\n\x1a\n': continue
                  width,height=struct.unpack('>II',head[16:24])
                  if width!=height or width<64: continue
                  candidates.append((min(width,512), width, p))
              except (OSError,ValueError): continue
          if not candidates:
              raise SystemExit('No official Meru PNG icon found in the .deb; not substituting a custom icon')
          _, width, selected=max(candidates)
          print(f'Using official icon: {selected} ({width}px)')
          shutil.copyfile(selected,'assets/meru-icon.png')
          PYICON
          rm -rf /tmp/meru-icon-source.deb /tmp/meru-official-package

      - name: Commit official icon to repository
        shell: bash
        run: |
          set -euo pipefail
          git add assets/meru-icon.png
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'Update official Meru application icon'
            git push origin HEAD:main
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check existing version tag
        id: exists
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.value }}
          FORCE: ${{ inputs.force_rebuild }}
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/mspdaniel/meru:${VERSION}"
          if [[ "$FORCE" != 'true' ]] && docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "Version $IMAGE already exists; skipping build."
            echo 'build=false' >> "$GITHUB_OUTPUT"
          else
            echo 'build=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push version + latest
        if: steps.exists.outputs.build == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          build-args: |
            MERU_VERSION=${{ steps.version.outputs.value }}
          tags: |
            ghcr.io/mspdaniel/meru:${{ steps.version.outputs.value }}
            ghcr.io/mspdaniel/meru:latest
          labels: |
            org.opencontainers.image.source=https://github.com/MSPDaniel/meru
            org.opencontainers.image.title=Meru Webtop
            org.opencontainers.image.version=${{ steps.version.outputs.value }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
